<style>
    /* ===== Hausstil cfaf2002 · Kachel-Grundlage v1 (siehe STYLEGUIDE.md) =====
       Farbschema 0 = Symcon-Design (Farben der Visualisierung), 1 = Dunkel, 2 = Hell.
       Modulspezifisch ist nur --brand (Akzent der festen Farbschemas). */
    :root {
        --brand: #f2b544;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --fg: var(--content-color, #eef3f7);
        --accent: var(--accent-color, var(--brand));
        --on-accent: #ffffff;
        --muted: color-mix(in srgb, var(--fg) 65%, transparent);
        --faint: color-mix(in srgb, var(--fg) 40%, transparent);
        --line: color-mix(in srgb, var(--fg) 15%, transparent);
        --surface: color-mix(in srgb, var(--fg) 7%, transparent);
        --surface-hover: color-mix(in srgb, var(--fg) 12%, transparent);
        --popup: var(--card-color, #232a33);
        --ok: #34b36b; --warn: #e2a63b; --bad: #e5484d; --info: #4b8ef0; --off: #8796a5;
        --radius-l: 14px; --radius: 12px; --radius-s: 8px; --pill: 999px; --gap: 8px;
    }
    html.theme-dark  { --fg: #eef3f7; --accent: var(--brand); --tile-bg: #1b2530; --popup: #232d39; }
    html.theme-light { --fg: #1d2b36; --accent: var(--brand); --tile-bg: #e9eef3; --popup: #ffffff; }
    html.theme-dark body, html.theme-light body { background: var(--tile-bg); }
    html, body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    /* ===== Ende Kachel-Grundlage ===== */

    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    * { box-sizing: border-box; }

    #tile {
        --deko-glow: color-mix(in srgb, var(--brand) 55%, transparent);
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 44px 14px 12px; /* oben Platz für den Instanznamen, den Symcon über die Kachel legt */
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 14px;
        line-height: 1.3;
    }

    /* Kopf: Status links, Lichtschalter rechts */
    .head { display: flex; align-items: center; gap: 12px; }
    .head-text { min-width: 0; flex: 1; }
    .status { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 17px; }
    .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 10px; height: 10px; border-radius: var(--pill); background: var(--off); flex: none; }
    .tone-ok .dot { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
    .tone-warn .dot { background: var(--warn); }
    .tone-bad .dot { background: var(--bad); }
    .tone-info .dot { background: var(--info); }
    .reason { color: var(--muted); font-size: 13px; margin: 2px 0 0 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #lightBtn {
        flex: none; width: 52px; height: 52px; border-radius: var(--pill); border: 1px solid var(--line);
        background: var(--surface); color: var(--muted); cursor: pointer; display: grid; place-items: center;
        transition: background .25s, color .25s, box-shadow .25s;
    }
    #lightBtn:hover { background: var(--surface-hover); }
    #lightBtn svg { width: 26px; height: 26px; }
    #lightBtn.on { background: var(--accent); color: var(--on-accent); border-color: transparent; box-shadow: 0 0 18px var(--deko-glow); }

    /* Hinweise */
    .alert { border-radius: var(--radius-s); padding: 6px 10px; font-size: 13px; background: color-mix(in srgb, var(--warn) 18%, transparent); border-left: 4px solid var(--warn); }
    .alert.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); border-left-color: var(--bad); }
    .alert b { font-weight: 650; }

    /* Lampen */
    .lamps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .lights-label { color: var(--muted); font-size: 12px; margin-right: 2px; }
    .lamp { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: var(--pill); background: var(--surface); font-size: 12px; min-width: 0; }
    .lamp i { width: 8px; height: 8px; border-radius: var(--pill); background: var(--off); flex: none; }
    .lamp.on i { background: var(--brand); box-shadow: 0 0 6px var(--deko-glow); }
    .lamp span { max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lamp.miss { outline: 1px solid var(--bad); }

    /* Werte */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: var(--gap); }
    .card { background: var(--surface); border-radius: var(--radius); padding: 8px 10px; min-width: 0; }
    .label { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .value { font-size: 18px; font-weight: 650; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { position: relative; height: 6px; border-radius: var(--pill); background: var(--line); margin: 7px 0 3px; }
    .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--pill); background: var(--accent); width: 0; transition: width .4s; }
    .bar .mark { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--fg); opacity: .5; }
    .bar.fault .fill { background: var(--off); }
    .bar.progress .fill { background: var(--info); }
    .scale { display: flex; justify-content: space-between; gap: 6px; color: var(--faint); font-size: 11px; white-space: nowrap; }

    /* Bedingungen (nur was gerade zutrifft) */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips:empty { display: none; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: var(--pill); background: var(--surface); font-size: 12px; }
    .chip i { width: 8px; height: 8px; border-radius: var(--pill); background: var(--off); }
    .chip.yes i { background: var(--ok); }
    .chip.no i { background: var(--bad); }
    .chip.note i { background: var(--warn); }

    /* Schalter */
    .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
    .toggle {
        flex: 1 1 auto; min-height: 38px; border-radius: var(--pill); border: 1px solid var(--line); background: var(--surface);
        color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 4px 6px 4px 14px; text-align: left; white-space: nowrap;
    }
    .toggle:hover { background: var(--surface-hover); }
    .toggle .sw { width: 34px; height: 20px; border-radius: var(--pill); background: var(--line); position: relative; flex: none; transition: background .2s; }
    .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: var(--pill); background: #fff; transition: transform .2s; }
    .toggle[aria-checked="true"] .sw { background: var(--accent); }
    .toggle[aria-checked="true"] .sw::after { transform: translateX(14px); }

    .foot { color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .foot:empty { display: none; }

    /* Schmale Kachel: kleinere Werte, damit Uhrzeiten nicht abgeschnitten werden */
    @media (max-width: 520px) {
        .stats { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
        .value { font-size: 15px; }
        .card { padding: 7px 8px; }
    }
    /* Heute länger */
    .extend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .extend .label { margin-right: 2px; }
    .ext {
        min-height: 36px; min-width: 56px; padding: 4px 12px; border-radius: var(--pill); border: 1px solid var(--line);
        background: var(--surface); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer;
    }
    .ext:hover { background: var(--surface-hover); }
    .ext[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }

    /* Fußzeile mit Knopf für die Diagnose */
    .footer { display: flex; align-items: center; gap: 8px; }
    .footer .foot { flex: 1; min-width: 0; }
    .link {
        margin-left: auto; min-height: 36px; padding: 4px 14px; border-radius: var(--pill); border: 1px solid var(--line);
        background: var(--surface); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; flex: none;
    }
    .link:hover { background: var(--surface-hover); }

    /* Diagnose: Ansicht über der ganzen Kachel */
    .sheet {
        position: fixed; inset: 0; z-index: 10; overflow-y: auto; overflow-x: hidden;
        background: var(--popup); color: var(--fg); padding: 44px 14px 14px;
        display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.35;
    }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .sheet-head b { font-size: 17px; }
    .sheet-head span { color: var(--muted); font-size: 12px; }
    #sheetClose {
        flex: none; width: 36px; height: 36px; border-radius: var(--pill); border: 1px solid var(--line);
        background: var(--surface); color: var(--fg); font-size: 20px; line-height: 1; cursor: pointer;
    }
    .sheet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--gap); align-items: start; }
    .sec { background: var(--surface); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
    .sec h4 { margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--accent); }
    .drow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; }
    .drow > span:first-child { color: var(--muted); min-width: 0; }
    .drow > span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
    .pill { display: inline-block; padding: 1px 9px; border-radius: var(--pill); font-size: 12px; font-weight: 600; color: #fff; background: var(--off); }
    .pill.y { background: var(--ok); }
    .pill.n { background: var(--bad); }
    .pill.w { background: var(--warn); }

    /* Kleine Kachel: nur Status, Werte und Schalter */
    @media (max-height: 340px) {
        .lamps, .chips, .foot, .extend { display: none; }
        .footer { justify-content: flex-end; }
    }
    @media (max-height: 240px) {
        .stats { display: none; }
    }
    [hidden] { display: none !important; }
</style>

<div id="tile" class="tone-off">
    <div class="head">
        <div class="head-text">
            <div class="status"><i class="dot" aria-hidden="true"></i><span id="status">–</span></div>
            <div class="reason" id="reason"></div>
        </div>
        <button id="lightBtn" type="button" role="switch" aria-checked="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21h6M10 18h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>

    <div class="alert bad" id="error" hidden></div>
    <div class="alert" id="sensorFault" hidden><b data-t="Brightness sensor not current">Brightness sensor not current</b><span id="faultText"></span></div>
    <div class="alert" id="unconfirmed" hidden><b data-t="No confirmation">No confirmation</b><span id="unconfirmedText"></span></div>

    <div class="lamps" id="lamps"><span class="lights-label" id="lightsLabel"></span></div>

    <div class="stats">
        <div class="card" id="luxCard">
            <div class="label" data-t="Brightness">Brightness</div>
            <div class="value" id="lux">–</div>
            <div class="bar" id="luxBar"><div class="fill" id="luxFill"></div><div class="mark" id="markOn"></div><div class="mark" id="markOff"></div></div>
            <div class="scale"><span id="limitOn"></span><span id="limitOff"></span></div>
        </div>
        <div class="card">
            <div class="label" id="sunLabel" data-t="Sunset">Sunset</div>
            <div class="value" id="sunset">–</div>
            <div class="sub" id="sunsetSub"></div>
        </div>
        <div class="card">
            <div class="label" id="windowLabel" data-t="Time window">Time window</div>
            <div class="value" id="window">–</div>
            <div class="sub" id="windowSub"></div>
        </div>
        <div class="card" id="runCard" hidden>
            <div class="label" data-t="Minimum on-time">Minimum on-time</div>
            <div class="value" id="run">–</div>

        </div>
    </div>

    <div class="extend" id="extend">
        <span class="label" data-t="Longer tonight">Longer tonight</span>
        <button class="ext" type="button" data-min="0" data-t="Normal">Normal</button>
        <button class="ext" type="button" data-min="30">+30 min</button>
        <button class="ext" type="button" data-min="60">+1 h</button>
        <button class="ext" type="button" data-min="120">+2 h</button>
        <button class="ext" type="button" data-min="180">+3 h</button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="toggles">
        <button class="toggle" type="button" role="switch" aria-checked="false" data-ident="Automatic"><span data-t="Automatic">Automatic</span><span class="sw" aria-hidden="true"></span></button>
        <button class="toggle" type="button" role="switch" aria-checked="false" data-ident="ForcePresence"><span data-t="Force presence">Force presence</span><span class="sw" aria-hidden="true"></span></button>
        <button class="toggle" type="button" role="switch" aria-checked="false" data-ident="AllowMultiple"><span data-t="Multiple">Multiple</span><span class="sw" aria-hidden="true"></span></button>
    </div>

    <div class="footer">
        <div class="foot" id="foot"></div>
        <button class="link" id="detailsBtn" type="button" aria-haspopup="dialog" data-t="Details">Details</button>
    </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-head">
        <div><b id="sheetTitle" data-t="Diagnosis">Diagnosis</b><br><span id="sheetSub"></span></div>
        <button id="sheetClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="sheet-grid" id="sheetBody"></div>
</div>

<script>
    // Hausstil: Farbschema der Kachel (0 = Symcon-Design, 1 = Dunkel, 2 = Hell)
    function applyTheme(theme) {
        var root = document.documentElement;
        root.classList.toggle('theme-dark', theme === 1);
        root.classList.toggle('theme-light', theme === 2);
    }

    (function () {
        'use strict';

        var $ = function (id) { return document.getElementById(id); };
        var tile = $('tile');
        var data = null;
        var offset = 0;       // Serverzeit minus Tablet-Zeit (Sekunden)
        var timer = 0;
        var inView = true;

        // Status → Farbton (Werte wie DekoLogic::ST_*)
        var TONES = { 0: 'info', 1: 'off', 2: 'ok', 3: 'off', 4: 'warn', 5: 'info', 6: 'info', 7: 'warn', 8: 'info', 9: 'off', 10: 'info' };

        function t(s) {
            return typeof window.translate === 'function' ? window.translate(s) : s;
        }

        function send(ident, value) {
            if (typeof window.requestAction === 'function') {
                window.requestAction(ident, value);
            }
        }

        function now() {
            return Math.floor(Date.now() / 1000) + offset;
        }

        function clock(ts) {
            var d = new Date((ts - offset) * 1000);
            return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        }

        function duration(sec) {
            sec = Math.max(0, Math.round(sec));
            var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
            return h > 0 ? h + ' h ' + m + ' min' : m + ' min';
        }

        function num(v) {
            return Math.round(v).toLocaleString(document.documentElement.lang || undefined);
        }

        function setText(id, text) {
            var el = $(id);
            if (el.textContent !== text) {
                el.textContent = text;
            }
        }

        function chip(label, state) {
            var el = document.createElement('span');
            el.className = 'chip ' + state;
            var dot = document.createElement('i');
            var text = document.createElement('span');
            text.textContent = label;
            el.appendChild(dot);
            el.appendChild(text);
            return el;
        }

        // Übersetzung der festen Texte
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
            el.textContent = t(el.getAttribute('data-t'));
        });

        function render(d) {
            if (typeof d.now === 'number') {
                offset = d.now - Math.floor(Date.now() / 1000);
            }
            data = d;
            applyTheme(d.theme || 0);

            tile.className = 'tone-' + (TONES[d.status] || 'off');
            setText('status', d.statusText || '–');
            var reason = d.reason || '';
            var isOn = d.status === 2 && d.lastTarget === 'on' && d.lastSwitch;
            if (isOn) {
                // Licht an: warum und seit wann eingeschaltet wurde
                reason = (d.lastReason ? d.lastReason + ' · ' : '') + t('since') + ' ' + clock(d.lastSwitch) + ' ' + t('o\'clock');
            }
            if (reason.toLowerCase() === (d.statusText || '').toLowerCase()) {
                reason = '';
            }
            setText('reason', reason);
            $('reason').hidden = reason === '';

            $('error').hidden = !d.error;
            setText('error', d.error || '');

            // Sensorfehler
            var fault = d.hasSensor && !d.sensorOk;
            $('sensorFault').hidden = !fault;
            if (fault) {
                setText('faultText', ' ' + t('Switching on by sunset only.') + (d.faultSince ? ' ' + t('Since') + ' ' + duration(now() - d.faultSince) : ''));
            }

            // Fehlende Rückmeldung
            var missing = d.unconfirmed || [];
            $('unconfirmed').hidden = missing.length === 0;
            setText('unconfirmedText', ' ' + missing.join(', '));

            // Lichtschalter und Lampen
            var btn = $('lightBtn');
            btn.classList.toggle('on', !!d.lightsOn);
            btn.setAttribute('aria-checked', d.lightsOn ? 'true' : 'false');
            btn.setAttribute('aria-label', t(d.lightsOn ? 'Switch all lights off' : 'Switch all lights on'));
            var lamps = $('lamps');
            while (lamps.children.length > 1) {
                lamps.removeChild(lamps.lastChild);
            }
            var list = d.lamps || [];
            var onCount = list.filter(function (l) { return l.on; }).length;
            setText('lightsLabel', t('Decoration light') + ' · ' + onCount + ' ' + t('of') + ' ' + list.length + ' ' + t('on'));
            list.forEach(function (l) {
                var el = document.createElement('span');
                el.className = 'lamp' + (l.on ? ' on' : '') + (missing.indexOf(l.name) >= 0 ? ' miss' : '');
                el.title = l.name + (l.until ? ' · ' + t('until') + ' ' + l.until : '') + (l.morning === false ? ' · ' + t('not in the morning') : '');
                var dot = document.createElement('i');
                var name = document.createElement('span');
                name.textContent = l.name;
                el.appendChild(dot);
                el.appendChild(name);
                lamps.appendChild(el);
            });

            // Helligkeit
            var luxOn = d.luxOn || 0, luxOff = d.luxOff || 0;
            $('luxCard').hidden = !d.hasSensor;
            if (d.hasSensor) {
                var arrow = d.trend > 0 ? ' ↗' : (d.trend < 0 ? ' ↘' : ' →');
                setText('lux', d.lux === null || d.lux === undefined ? '–' : num(d.lux) + ' lx' + arrow);
                var max = Math.max(luxOff * 1.4, luxOn * 2, 100);
                var pct = function (v) { return Math.max(0, Math.min(100, v / max * 100)) + '%'; };
                $('luxFill').style.width = pct(d.lux || 0);
                $('markOn').style.left = pct(luxOn);
                $('markOff').style.left = pct(luxOff);
                $('luxBar').classList.toggle('fault', !d.sensorOk);
                setText('limitOn', t('On') + ' < ' + num(luxOn));
                setText('limitOff', t('Off') + ' > ' + num(luxOff));
            }

            // Zeitfenster
            setText('window', (d.timeOn || '–') + '–' + (d.timeOff || '–'));
            setText('windowLabel', t(d.morningWindow ? 'Morning window' : 'Time window'));
            setText('windowSub', (d.window ? t('active') : t('not active'))
                + (d.specialName ? ' · ' + d.specialName : (d.weekend ? ' · ' + t('weekend') : ''))
                + (d.extended ? ' · +' + (d.extended % 60 ? d.extended + ' min' : d.extended / 60 + ' h') : ''));

            // Heute länger: nur im Abend und davor sinnvoll, nicht im Morgenfenster
            $('extend').hidden = !!d.morningWindow;
            Array.prototype.forEach.call(document.querySelectorAll('.ext'), function (el) {
                el.setAttribute('aria-pressed', String(Number(el.getAttribute('data-min')) === (d.extend || 0)));
            });

            // Bedingungen
            var chips = $('chips');
            chips.textContent = '';
            if (d.present !== undefined) {
                if (!d.present) {
                    chips.appendChild(chip(t('Nobody present'), 'no'));
                } else if (d.force && d.presenceSensor === false) {
                    chips.appendChild(chip(t('Presence forced'), 'note'));
                }
                if (d.simulation) {
                    chips.appendChild(chip(t('Vacation simulation'), 'note'));
                } else if (d.vacation) {
                    chips.appendChild(chip(t('Vacation'), 'note'));
                }
                if (d.onToday && !d.multiple && d.status !== 2) {
                    chips.appendChild(chip(t('Switched on today'), ''));
                }
                if (d.bright) {
                    chips.appendChild(chip(t('Permanently bright'), 'note'));
                }
            }

            // Schalter
            Array.prototype.forEach.call(document.querySelectorAll('.toggle'), function (el) {
                var key = { Automatic: 'automatic', ForcePresence: 'force', AllowMultiple: 'multiple' }[el.getAttribute('data-ident')];
                el.setAttribute('aria-checked', d[key] ? 'true' : 'false');
                el.title = t({ Automatic: 'Automatic', ForcePresence: 'Force presence', AllowMultiple: 'Allow multiple switch-ons' }[el.getAttribute('data-ident')]);
            });

            // Letzte Schaltung
            setText('foot', d.lastSwitch && !isOn ? t('Last switched') + ': ' + clock(d.lastSwitch) + ' · ' + t(d.lastTarget === 'on' ? 'on' : 'off') + (d.lastReason ? ' · ' + d.lastReason : '') : '');

            tickTime();
            schedule();
            if (!$('sheet').hidden) {
                renderDebug();
            }
        }

        // ===== Diagnose =====
        function pill(value, yes, no) {
            var el = document.createElement('span');
            el.className = 'pill ' + (value ? 'y' : 'n');
            el.textContent = value ? (yes || t('Yes')) : (no || t('No'));
            return el;
        }

        function stamp(ts) {
            if (!ts) {
                return '–';
            }
            var d = new Date((ts - offset) * 1000);
            return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '. ' + clock(ts);
        }

        function section(title, rows) {
            var sec = document.createElement('div');
            sec.className = 'sec';
            var h = document.createElement('h4');
            h.textContent = title;
            sec.appendChild(h);
            rows.forEach(function (r) {
                if (!r) {
                    return;
                }
                var row = document.createElement('div');
                row.className = 'drow';
                var label = document.createElement('span');
                label.textContent = r[0];
                var value = document.createElement('span');
                [].concat(r[1]).forEach(function (part, i) {
                    if (i > 0) {
                        value.appendChild(document.createTextNode(' '));
                    }
                    if (typeof part === 'boolean') {
                        value.appendChild(pill(part));
                    } else if (part && part.nodeType) {
                        value.appendChild(part);
                    } else {
                        value.appendChild(document.createTextNode(part === null || part === undefined || part === '' ? '–' : String(part)));
                    }
                });
                row.appendChild(label);
                row.appendChild(value);
                sec.appendChild(row);
            });
            return sec;
        }

        function renderDebug() {
            var body = $('sheetBody');
            body.textContent = '';
            var d = data || {};
            var D = d.debug;
            setText('sheetSub', (d.statusText || '') + (d.reason ? ' · ' + d.reason : ''));
            if (!D) {
                body.appendChild(section(t('Diagnosis'), [[t('Data'), t('No evaluation yet – instance not active?')]]));
                return;
            }
            var n = now();
            var minRunLeft = d.onSince ? d.onSince + d.minRun - n : 0;
            var age = D.sensorUpdated ? n - D.sensorUpdated : 0;

            body.appendChild(section(t('Prerequisites'), [
                [t('Automatic'), D.automatic],
                [t('Season'), D.seasonMode ? (D.inSeason ? [true] : [false, t('from') + ' ' + D.seasonStart]) : t('All year round')],
                [t(D.morning ? 'Morning window' : 'Time window'), D.windowOn + '–' + D.windowOff],
                [t('Time window active'), D.window],
                [t('Weekend'), D.weekend],
                [t('Special day'), D.specialName ? [true, D.specialName] : false],
                [t('Longer tonight'), D.extended ? '+' + D.extended + ' min' : t('Normal')],
                [t('Over midnight'), D.overMidnight],
                [t('Present (total)'), D.present],
                [t('Presence sensor'), D.presenceSensor === null ? t('none (always present)') : D.presenceSensor],
                [t('Force presence'), D.force],
                [t('Vacation'), D.vacation],
                [t('Vacation simulation'), D.simulation],
                D.pendingTarget ? [t('Planned switching'), t(D.pendingTarget) + ' ' + t('at') + ' ' + clock(D.pendingAt)] : null
            ]));

            body.appendChild(section(t('Triggers'), [
                [t('Brightness'), D.lux === null || D.lux === undefined ? '–' : num(D.lux) + ' lx'],
                [t('Darker than') + ' ' + num(D.luxOn) + ' lx', D.byLux],
                [t(D.morning ? 'Before sunrise' : 'Sunset reached'), D.sunDark],
                [t('Permanently bright') + ' (' + D.brightCount + '/5 > ' + num(D.luxOff) + ')', D.bright],
                [t('History (every 5 min)'), (D.history || []).map(num).join(' / ')],
                [t('Sensor current'), D.hasSensor ? D.sensorOk : t('no sensor')],
                [t('Last sensor value'), D.sensorUpdated ? stamp(D.sensorUpdated) + ' (' + duration(age) + ')' : '–'],
                D.faultSince ? [t('Sensor fault since'), stamp(D.faultSince)] : null,
                [t('Sunset'), D.sunset ? clock(D.sunset) : '–'],
                [t('Sunrise'), D.sunrise ? clock(D.sunrise) : '–']
            ]));

            body.appendChild(section(t('Day control'), [
                [t('Switching evening'), D.dayKey],
                [t('Switched on today'), D.onToday],
                [t('Allow multiple switch-ons'), D.multiple],
                [t('Switching on allowed today'), D.multiple || !D.onToday],
                [t('Enforce target on every check'), D.enforce]
            ]));

            body.appendChild(section(t('Result'), [
                [t('Status'), d.statusText || ''],
                [t('Reason'), d.reason || ''],
                [t('Decision'), D.target === null ? t('do nothing') : pill(D.target === 'on', t('on'), t('off'))],
                [t('Last automatic target'), D.lastTarget ? pill(D.lastTarget === 'on', t('on'), t('off')) : '–'],
                [t('Minimum on-time'), d.onSince ? (minRunLeft > 0 ? t('still') + ' ' + duration(minRunLeft) : pill(true, t('reached'))) : '–'],
                [t('Next window from'), D.nextOn]
            ]));

            body.appendChild(section(t('Lights'), (D.lamps || []).map(function (l) {
                var extra = [];
                if (l.until) {
                    extra.push(t('until') + ' ' + l.until);
                }
                if (l.morning === false) {
                    extra.push(t('not in the morning'));
                }
                if (l.dimmer) {
                    extra.push(t('Dimmer') + ' ' + l.level);
                }
                var parts = [];
                if (extra.length) {
                    parts.push(extra.join(' · '));
                }
                if (!l.exists || !l.action) {
                    var warn = document.createElement('span');
                    warn.className = 'pill w';
                    warn.textContent = t(l.exists ? 'no action' : 'missing');
                    parts.push(warn);
                } else {
                    parts.push(pill(l.on, t('on'), t('off')));
                }
                return [l.name + ' (#' + l.id + ')', parts];
            })));

            body.appendChild(section(t('System'), [
                [t('Last switched'), d.lastSwitch ? stamp(d.lastSwitch) + ' · ' + t(d.lastTarget === 'on' ? 'on' : 'off') : '–'],
                [t('Reason'), d.lastReason || ''],
                [t('No confirmation'), (d.unconfirmed || []).length ? (d.unconfirmed || []).join(', ') : '–'],
                [t('Instance'), d.instanceStatus === 102 ? pill(true, t('active')) : pill(false, '', d.error || String(d.instanceStatus))],
                [t('Data from'), stamp(n)]
            ]));
        }

        function openSheet(open) {
            $('sheet').hidden = !open;
            $('detailsBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
            if (open) {
                renderDebug();
                $('sheetClose').focus();
            } else {
                $('detailsBtn').focus();
            }
        }

        $('detailsBtn').addEventListener('click', function () { openSheet(true); });
        $('sheetClose').addEventListener('click', function () { openSheet(false); });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !$('sheet').hidden) {
                openSheet(false);
            }
        });

        // Teile, die von der Uhrzeit abhängen (Countdown)
        function tickTime() {
            if (!data) {
                return;
            }
            if (!$('sheet').hidden) {
                renderDebug();
            }
            var n = now();
            var sun = data.sunrise || data.sunset;
            setText('sunLabel', t(data.sunrise ? 'Sunrise' : 'Sunset'));
            if (sun) {
                setText('sunset', clock(sun));
                var diff = sun - n;
                setText('sunsetSub', diff > 0 ? t('in') + ' ' + duration(diff) : t('since') + ' ' + duration(-diff));
            } else {
                setText('sunset', '–');
                setText('sunsetSub', t('not available'));
            }
            var runLeft = data.onSince ? data.onSince + data.minRun - n : 0;
            var showRun = data.onSince > 0 && data.minRun > 0 && runLeft > 0;
            $('runCard').hidden = !showRun;
            if (showRun) {
                setText('run', t('still') + ' ' + duration(runLeft));
                $('runFill').style.width = Math.min(100, (n - data.onSince) / data.minRun * 100) + '%';
            }
        }

        function schedule() {
            clearInterval(timer);
            timer = 0;
            if (inView && document.visibilityState !== 'hidden') {
                timer = setInterval(tickTime, 30000);
            }
        }

        $('lightBtn').addEventListener('click', function () {
            send('Lights', !(data && data.lightsOn));
        });
        Array.prototype.forEach.call(document.querySelectorAll('.toggle'), function (el) {
            el.addEventListener('click', function () {
                send(el.getAttribute('data-ident'), el.getAttribute('aria-checked') !== 'true');
            });
        });

        Array.prototype.forEach.call(document.querySelectorAll('.ext'), function (el) {
            el.addEventListener('click', function () {
                send('Extend', Number(el.getAttribute('data-min')));
            });
        });

        document.addEventListener('visibilitychange', schedule);
        if (window.IntersectionObserver) {
            new IntersectionObserver(function (entries) {
                inView = entries[0].isIntersecting;
                if (inView) {
                    tickTime();
                }
                schedule();
            }).observe(tile);
        }

        // Wird von IP-Symcon bei UpdateVisualizationValue() aufgerufen
        window.handleMessage = function (msg) {
            try {
                render(typeof msg === 'string' ? JSON.parse(msg) : msg);
            } catch (e) {
                console.error('Deko-Kachel:', e);
            }
        };

        var initial = /*INITIAL_DATA*/null;
        if (initial) {
            window.handleMessage(initial);
        }
    })();
</script>
